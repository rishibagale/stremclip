[project]
name = "streamclip"
version = "0.1.0"
description = "High-performance multimodal livestream highlight extractor and 1080x1920 vertical shorts creator."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Rishi Bagale", email = "rushikeshbagle72@gmail.com" },
]
keywords = [
    "livestream",
    "clips",
    "video-editing",
    "opusclip",
    "supoclip",
    "whisper",
    "ffmpeg",
    "shorts",
    "tiktok",
    "facecam",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.0.0",
    "scipy>=1.11.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
audio-ml = [
    "librosa>=0.10.1",
    "torchaudio>=2.2.0",
]
ui = [
    "altair>=5.3.0",
    "streamlit>=1.35.0",
]
vision = [
    "opencv-python-headless>=4.9.0",
    "pillow>=10.2.0",
]
whisper = [
    "faster-whisper>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/rishibagale/stremclip"
Repository = "https://github.com/rishibagale/stremclip"
Issues = "https://github.com/rishibagale/stremclip/issues"

[project.scripts]
streamclip = "streamclip.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "types-pyyaml>=6.0.12",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "streamlit",
    "streamlit.*",
    "altair",
    "altair.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
